    url: graphql/mud-wtr-storefront.graphql
  - type: Introspection
    url: graphql/mud-wtr-storefront-introspection.json
  - type: DataModel
    url: data-model/mud-wtr-data-model.yml
- aid: mud-wtr-storefront-json
  name: MUD\WTR Storefront JSON Endpoints
  description: 'Anonymous read-only JSON over the storefront: /products.json and /collections.json for
    the catalog, /products/{handle}.json and /collections/{handle}/products.json for single resources,
    and /cart.js for the session cart. Documented in the store''s own /agents.md and /llms.txt.'
  humanURL: https://mudwtr.com/llms.txt
  baseURL: https://mudwtr.com
  tags:
  - JSON
  - Catalog
  - Cart
