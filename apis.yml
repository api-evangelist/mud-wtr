apis:
- aid: mud-wtr-ucp-commerce-mcp
  name: MUD\WTR UCP Commerce MCP Server
  description: 'Universal Commerce Protocol (UCP) shopping service, exposed over MCP at
    https://mudwtr.com/api/ucp/mcp. Server identifies itself as "universal-commerce" 0.1.0 speaking MCP
    protocol 2025-06-18 and UCP 2026-04-08. tools/list answers anonymously with 13 tools covering
    catalog search/lookup, cart create/read/update/cancel, checkout create/read/update/complete/cancel,
    and order lookup. Checkout completion requires contemporaneous buyer approval.'
  humanURL: https://mudwtr.com/agents.md
  baseURL: https://mudwtr.com/api/ucp/mcp
  tags:
  - MCP
  - Commerce
  - Checkout
  - Cart
  - Catalog
  properties:
  - type: MCPServer
    url: mcp/mud-wtr-mcp.yml
  - type: ToolCrosswalk
    url: mcp/mud-wtr-tool-crosswalk.yml
- aid: mud-wtr-storefront-mcp
  name: MUD\WTR Storefront MCP Server
  description: 'Shopify Storefront MCP server at https://mudwtr.com/api/mcp, identifying itself as
    "storefront-renderer" 0.1.0 on MCP protocol 2025-06-18. Five anonymous tools: search_catalog,
    get_product_details, get_cart, update_cart and search_shop_policies_and_faqs.'
  humanURL: https://mudwtr.com/agents.md
  baseURL: https://mudwtr.com/api/mcp
  tags:
  - MCP
  - Catalog
  - Cart
  - Policies
  properties:
  - type: MCPServer
    url: mcp/mud-wtr-mcp.yml
- aid: mud-wtr-storefront-graphql
  name: MUD\WTR Storefront GraphQL API
  description: 'Shopify Storefront GraphQL API served on the company''s own host at
    https://mudwtr.com/api/2025-10/graphql.json. Full introspection answers anonymously: 414 types, 34
    query root fields and 41 mutations covering products, collections, blogs, pages, menus, search,
    cart lifecycle and customer accounts. Query cost is returned in extensions.cost.'
  humanURL: https://mudwtr.com/llms.txt
  baseURL: https://mudwtr.com/api/2025-10/graphql.json
  tags:
  - GraphQL
  - Storefront
  - Commerce
  - Catalog
  properties:
