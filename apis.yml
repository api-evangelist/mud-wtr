aid: mud-wtr
name: Mud\Wtr
description: 'MUD\WTR is a certified-organic coffee alternative built on adaptogenic mushrooms and
  botanicals, sold direct-to-consumer from mudwtr.com. It publishes no traditional developer program,
  but its Shopify-hosted storefront exposes a substantial, entirely anonymous machine surface on its
  own domain: an agents.md/llms.txt agent contract, a Universal Commerce Protocol (UCP) merchant
  profile at /.well-known/ucp, two live Model Context Protocol servers (a 13-tool UCP commerce server
  and a 5-tool Storefront MCP server), an anonymously introspectable Storefront GraphQL API, and the
  storefront JSON endpoints for products, collections and cart.'
