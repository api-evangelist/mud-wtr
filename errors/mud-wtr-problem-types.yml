method: derived
source: >-
  Derived from the error enums in graphql/mud-wtr-storefront-introspection.json and from live error
  responses observed against https://mudwtr.com/api/ucp/mcp and
  https://mudwtr.com/api/2025-10/graphql.json on 2026-08-26
format: graphql-user-errors + jsonrpc-error
rfc9457: false
description: >-
  MUD\WTR publishes no error reference. This catalogue is derived from the two error envelopes its
  surfaces actually emit — the JSON-RPC error object on MCP and the GraphQL errors[]/typed
  *UserError payloads — plus the typed error-code enums carried in the introspected schema. No
  application/problem+json is served anywhere, so there are no RFC 9457 problem types.
envelopes:
- surface: MCP (both servers)
  transport: JSON-RPC 2.0 over HTTP POST
  http_status_on_error: 200
  shape: '{ "jsonrpc": "2.0", "id": <n>, "error": { "code": <int>, "message": <string>, "data": <string|object> } }'
- surface: Storefront GraphQL
  transport: HTTP POST
  http_status_on_error: 200
  shape: '{ "errors": [ { "message", "locations", "path", "extensions": { "code", "typeName", "fieldName" } } ] }'
  mutation_shape: 'data.<mutation>.userErrors[] { code, field[], message } — typed per mutation family'
observed:
- code: -32000
  surface: https://mudwtr.com/api/ucp/mcp
  message: AuthenticationRequired
  data: >-
    Unauthorized: A valid JWT is required to call <tool>. See
    https://shopify.dev/docs/agents/get-started/authentication for instructions on generating a token
    and authenticating your requests.
  remediation: Obtain a Shopify agent JWT and send it as a bearer token.
  probed: '2026-08-26'
- code: -32001
  surface: https://mudwtr.com/api/ucp/mcp
  message: UCP discovery failed
  data: '{ "code": "invalid_profile_url", "content": "Unable to fetch agent profile: Missing profile uri", "continue_url": "https://mud-wtr.myshopify.com/" }'
  remediation: Pass a resolvable agent profile URI in meta.ucp-agent.profile on every tool call.
  probed: '2026-08-26'
- code: undefinedField
  surface: https://mudwtr.com/api/2025-10/graphql.json
  message: "Field '<name>' doesn't exist on type 'QueryRoot'"
  remediation: Validate the query against graphql/mud-wtr-storefront.graphql before sending.
  probed: '2026-08-26'
code_families:
- name: CartErrorCode
  count: 55
  applies_to: cart mutations (cartLinesAdd, cartLinesUpdate, cartDeliveryAddresses*, cartDiscountCodesUpdate, …)
  notable: [INVALID, INVALID_MERCHANDISE_LINE, MERCHANDISE_NOT_APPLICABLE, MISSING_DISCOUNT_CODE,
