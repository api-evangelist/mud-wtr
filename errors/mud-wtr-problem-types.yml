- name: SubmissionErrorCode
  count: 95
  applies_to: cartSubmitForCompletion / complete_checkout
  notable: [ERROR, NO_DELIVERY_GROUP_SELECTED, BUYER_IDENTITY_EMAIL_REQUIRED, DELIVERY_ADDRESS_REQUIRED,
    DELIVERY_NO_DELIVERY_AVAILABLE, DELIVERY_INVALID_POSTAL_CODE_FOR_COUNTRY,
    MERCHANDISE_NOT_ENOUGH_STOCK_AVAILABLE, MERCHANDISE_LINE_LIMIT_REACHED]
  note: The single largest failure surface an agent will hit; almost all of it is address validation.
- name: CompletionErrorCode
  count: 13
  applies_to: cartCompletionAttempt / checkout completion
  notable: [ERROR, INVENTORY_RESERVATION_ERROR, PAYMENT_ERROR, PAYMENT_TRANSIENT_ERROR,
    PAYMENT_AMOUNT_TOO_SMALL, PAYMENT_GATEWAY_NOT_ENABLED_ERROR, PAYMENT_INSUFFICIENT_FUNDS,
    PAYMENT_INVALID_PAYMENT_METHOD, PAYMENT_INVALID_CURRENCY, PAYMENT_INVALID_CREDIT_CARD,
    PAYMENT_INVALID_BILLING_ADDRESS, PAYMENT_CARD_DECLINED, PAYMENT_CALL_ISSUER]
  note: >-
    This is the nearest thing MUD\WTR has to a decline-code reference. It is the buyer-facing subset
    Shopify surfaces to a storefront; the acquirer's raw decline codes are not exposed. No separate
    decline-codes artifact was written because MUD\WTR is a merchant, not a payments provider.
  retry_guidance:
    transient: [PAYMENT_TRANSIENT_ERROR, INVENTORY_RESERVATION_ERROR]
    do_not_retry: [PAYMENT_CARD_DECLINED, PAYMENT_INSUFFICIENT_FUNDS, PAYMENT_INVALID_CREDIT_CARD,
