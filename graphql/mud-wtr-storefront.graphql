input ApplePayWalletContentInput {
  billingAddress: MailingAddressInput!
  data: String!
  header: ApplePayWalletHeaderInput!
  lastDigits: String
  signature: String!
  version: String!
}

input ApplePayWalletHeaderInput {
  applicationData: String
  ephemeralPublicKey: String!
  publicKeyHash: String!
  transactionId: String!
}

input AttributeInput {
  key: String!
  value: String!
}

input BuyerInput {
  customerAccessToken: String!
  companyLocationId: ID
}

input CartAddressInput {
  deliveryAddress: CartDeliveryAddressInput
  copyFromCustomerAddressId: ID
}

input CartBuyerIdentityInput {
  email: String
  phone: String
  companyLocationId: ID
  countryCode: CountryCode
  customerAccessToken: String
  preferences: CartPreferencesInput
}

input CartDeliveryAddressInput {
  address1: String
  address2: String
  city: String
  company: String
  countryCode: CountryCode
  firstName: String
  lastName: String
  phone: String
  provinceCode: String
  zip: String
}

input CartDeliveryCoordinatesPreferenceInput {
  latitude: Float!
  longitude: Float!
  countryCode: CountryCode!
}

input CartDeliveryInput {
  addresses: [CartSelectableAddressInput!]
}

input CartDeliveryPreferenceInput {
  deliveryMethod: [PreferenceDeliveryMethodType!]
  pickupHandle: [String!]
  coordinates: CartDeliveryCoordinatesPreferenceInput
}

input CartDirectPaymentMethodInput {
  billingAddress: MailingAddressInput!
  sessionId: String!
  cardSource: CartCardSource
  acceptedSubscriptionTerms: Boolean = false
}

input CartFreePaymentMethodInput {
  billingAddress: MailingAddressInput!
}

input CartInput {
  attributes: [AttributeInput!]
  lines: [CartLineInput!]
  discountCodes: [String!]
  giftCardCodes: [String!]
  note: String
  buyerIdentity: CartBuyerIdentityInput
  delivery: CartDeliveryInput
  metafields: [CartInputMetafieldInput!]
}

input CartInputMetafieldInput {
  key: String!
  value: String!
  type: String!
}

input CartLineInput {
  attributes: [AttributeInput!]
  quantity: Int = 1
  merchandiseId: ID!
  sellingPlanId: ID
  parent: CartLineParentInput
}

input CartLineParentInput {
  lineId: ID
  merchandiseId: ID
}

