method: derived
source: >-
  Derived by binding the live MCP tool lists (mcp/mud-wtr-ucp-mcp-tools.json,
  mcp/mud-wtr-storefront-mcp-tools.json, both captured 2026-08-26) to the anonymously introspected
  Storefront GraphQL schema (graphql/mud-wtr-storefront.graphql) and the storefront JSON endpoints
  documented in https://mudwtr.com/agents.md.
description: >-
  MUD\WTR publishes no OpenAPI, so the REST column of this crosswalk is the storefront JSON surface
  the store documents itself (/products.json, /collections.json, /products/{handle}.json, /cart.js)
  and the primary contract column is the Storefront GraphQL schema. No published mapping exists
  between the MCP tools and the GraphQL root fields; every binding below was made by name and
  semantics and is graded accordingly.
surfaces:
  openapi: null
  openapi_note: No OpenAPI or Swagger document is served on any MUD\WTR host (see well-known probe).
  graphql:
    endpoint: https://mudwtr.com/api/2025-10/graphql.json
    gated: false
    note: Full introspection answers anonymously; served version reported as 2025-10.
  mcp:
  - endpoint: https://mudwtr.com/api/ucp/mcp
    gated: partial
    note: tools/list anonymous; tools/call requires a Shopify agent JWT + UCP agent profile.
  - endpoint: https://mudwtr.com/api/mcp
    gated: false
    note: tools/list and tools/call both answered anonymously during the probe.
  json:
    base: https://mudwtr.com
    gated: false
crosswalk:
- tool: search_catalog
  server: both
  category: catalog
  graphql: [products, search, predictiveSearch]
  rest: ['GET /products.json', 'GET /collections/{handle}/products.json', 'GET /search?q=&type=product']
  binding: semantic
  confidence: high
  note: Probed live on /api/mcp; returned gid://shopify/Product records matching /products.json.
- tool: lookup_catalog
  server: ucp
  category: catalog
  graphql: [nodes, products, productByHandle]
  rest: ['GET /products/{handle}.json']
  binding: semantic
  confidence: medium
- tool: get_product
