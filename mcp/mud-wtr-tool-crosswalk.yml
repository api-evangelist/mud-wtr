  category: catalog
  graphql: [product, productByHandle]
  rest: ['GET /products/{handle}.json']
  binding: semantic
  confidence: high
- tool: get_product_details
  server: storefront
  category: catalog
  graphql: [product, productByHandle]
  rest: ['GET /products/{handle}.json']
  binding: semantic
  confidence: high
  note: The `options` argument maps to Product.variantBySelectedOptions.
- tool: create_cart
  server: ucp
  category: cart
  graphql: [cartCreate]
  rest: ['POST /cart/add.js']
  binding: semantic
  confidence: high
- tool: get_cart
  server: both
  category: cart
  graphql: [cart]
  rest: ['GET /cart.js']
  binding: semantic
  confidence: high
- tool: update_cart
  server: both
  category: cart
  graphql: [cartLinesAdd, cartLinesUpdate, cartLinesRemove, cartBuyerIdentityUpdate, cartDeliveryAddressesAdd,
    cartDeliveryAddressesReplace, cartDeliveryAddressesUpdate, cartSelectedDeliveryOptionsUpdate,
    cartDiscountCodesUpdate, cartGiftCardCodesAdd, cartGiftCardCodesRemove, cartNoteUpdate]
  rest: ['POST /cart/change.js', 'POST /cart/update.js']
  binding: composite
  confidence: high
  note: >-
    One tool call fans out to many GraphQL mutations; the tool's inputSchema exposes add_items,
    update_items, remove_line_ids, buyer_identity, delivery_addresses_to_add,
    delivery_addresses_to_replace, selected_delivery_options, discount_codes, gift_card_codes, note.
