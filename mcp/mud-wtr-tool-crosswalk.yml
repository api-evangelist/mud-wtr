    Shop exposes privacyPolicy, refundPolicy, shippingPolicy, subscriptionPolicy and termsOfService.
    A live probe for "refund window" returned an empty array, so the FAQ index appears unpopulated.
mcp_only:
- tool: cancel_cart
  reason: No cart-cancel mutation exists in the Storefront GraphQL schema.
- tool: cancel_checkout
  reason: No checkout-cancel mutation exists in the Storefront GraphQL schema.
- tool: get_order
  reason: >-
    The Storefront GraphQL Order type is only reachable through Customer, which requires a customer
    access token; there is no anonymous order query.
